# Publishes this talk repository to GitHub Pages on every push to main. The same
# file lives in every talk repository; nothing in it is specific to one deck. The
# deck type is detected from the repository contents: a .slide file is rendered
# once with Go present and published with present's own stylesheet and scripts,
# a package.json is built with Slidev through pnpm, and anything else is published
# as the exported HTML it already is, with slides.html serving as the index when
# no index.html exists. The result is served at iamrajiv.github.io/<repository name>/.
# GitHub Pages must be switched on once per repository, in Settings > Pages, with
# the source set to GitHub Actions; the workflow token is not allowed to do that.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: deck
        run: |
          if ls *.slide >/dev/null 2>&1; then
            echo "type=present" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ]; then
            echo "type=slidev" >> "$GITHUB_OUTPUT"
          else
            echo "type=html" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.deck.outputs.type == 'present'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      - if: steps.deck.outputs.type == 'present'
        run: |
          go install golang.org/x/tools/cmd/present@v0.45.0
          present -http=127.0.0.1:3999 -notes &
          sleep 3
          mkdir -p dist/static
          slide=$(ls *.slide | head -1)
          curl -sf "http://127.0.0.1:3999/$slide" > dist/index.html
          for f in $(curl -sf http://127.0.0.1:3999/static/ | grep -o 'href="[^"]*"' | sed 's/href="//;s/"//'); do
            curl -sf "http://127.0.0.1:3999/static/$f" -o "dist/static/$f"
          done
          curl -sf http://127.0.0.1:3999/play.js -o dist/play.js
          if [ -d images ]; then cp -R images dist/; fi
          sed -i -e "s|'/static/|'static/|g" -e 's|"/static/|"static/|g' \
                 -e "s|'/play\.js'|'play.js'|g" -e 's|"/play\.js"|"play.js"|g' \
                 dist/index.html dist/static/*.js dist/play.js

      - if: steps.deck.outputs.type == 'slidev'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - if: steps.deck.outputs.type == 'slidev'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.deck.outputs.type == 'slidev'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build --base "/${{ github.event.repository.name }}/"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - if: steps.deck.outputs.type == 'html'
        run: |
          mkdir -p dist
          rsync -a --exclude .git --exclude .github --exclude dist ./ dist/
          if [ ! -f dist/index.html ] && [ -f dist/slides.html ]; then cp dist/slides.html dist/index.html; fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
